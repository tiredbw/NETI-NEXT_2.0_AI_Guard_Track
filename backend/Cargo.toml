[package]
name = "astraguard"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.5"
axum = "0.8.9"
base64 = "0.23.1"
hex = "0.4.3"
percent-encoding = "2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
